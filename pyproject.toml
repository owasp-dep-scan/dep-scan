[project]
name = "owasp-depscan"
version = "7.0.0.dev0"
description = "Fully open-source security audit for project dependencies based on known vulnerabilities and advisories."
authors = [
    {name = "Team AppThreat", email = "cloud@appthreat.com"},
]
dependencies = [
    "appthreat-vulnerability-db[oras]~=6.7.7",
    "custom-json-diff~=2.1.6",
    "defusedxml~=0.7.1",
    "httpx~=0.28.1",
    "PyYAML~=6.0.2",
    "rich~=15.0.0",
    "Jinja2~=3.1.6",
    "packageurl-python~=0.17.6",
    "cvss~=3.6",
    "ds-xbom-lib~=7.0.0.dev0",
    "ds-analysis-lib~=7.0.0.dev0",
    "ds-reporting-lib~=7.0.0.dev0"
]

requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/owasp-dep-scan/dep-scan"
Bug-Tracker = "https://github.com/owasp-dep-scan/dep-scan/issues"
Funding = "https://owasp.org/donate/?reponame=www-project-dep-scan&title=OWASP+depscan"

[project.scripts]
depscan = "depscan.cli:main"
depscan-vdb = "depscan.vdb_cli:main"
depscan-validate = "depscan.validate_cli:main"

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "pytest-cov~=7.1.0"
]
server = ["ds-server-lib~=7.0.0.dev0"]
ext = ["atom-tools~=0.9.1", "blint~=3.2.3"]
all = ["atom-tools~=0.9.1", "blint~=3.2.3", "ds-server-lib~=7.0.0.dev0", "PyGithub~=2.10.0"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages = ["depscan", "depscan.lib", "depscan.lib.package_query", "vendor", "vendor.spdx.json"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q -s --verbose --cov-append --cov-report term --cov depscan --cov packages/analysis-lib --cov packages/xbom-lib --cov packages/server-lib"
testpaths = [
    "test",
    "packages/analysis-lib/tests",
    "packages/server-lib/tests"
]

[tool.pyrefly]
# Check against the oldest supported Python so accidental use of newer
# stdlib/typing APIs is caught (requires-python = ">=3.11").
python-version = "3.11"
# Resolve third-party dependencies from the project venv.
python-interpreter-path = ".venv/bin/python"
# The repo is a uv workspace with multiple source roots: the flat depscan
# package at the root plus one src/ layout per package under packages/.
search-path = [
    ".",
    "packages/analysis-lib/src",
    "packages/xbom-lib/src",
    "packages/reporting-lib/src",
    "packages/server-lib/src",
]
project-includes = [
    "depscan/**",
    "packages/**",
    "test/**",
    "vendor/__init__.py",
]
project-excludes = [
    "**/__pycache__",
    "**/.venv",
    "build/**",
]
# tomllib is stdlib on Python 3.11 and later, which is what
# depscan/lib/tomlparse.py imports; keep the entry so pyrefly resolves it
# even when the project venv lacks a tomllib stub.
ignore-missing-imports = ["tomllib"]

[tool.uv]
# blint 3.x was built and tested against wasm-tools 1.x and multi-demangle 1.x;
# the 2.x lines arrive with blint 4.
constraint-dependencies = [
    "wasm-tools~=1.0",
    "multi-demangle~=1.0",
]

[tool.uv.sources]
ds-xbom-lib = { workspace = true }
ds-analysis-lib = { workspace = true }
ds-reporting-lib = { workspace = true }
ds-server-lib = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pyrefly~=1.4.1",
    "ruff~=0.17.4",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "test",
]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F405", "F841"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
