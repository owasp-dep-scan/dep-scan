name: Pinned actions with write permissions, the negative control

on: [push]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@1d96c7ea4c2e3c6508a2f6b0cb1d8a1dcd70e8b6
      - name: Third-party action pinned to a full commit digest
        uses: example-org/shared-workflows@0e2f5b1a3c9d4e7f8a6b5c4d3e2f1a0b9c8d7e6f
