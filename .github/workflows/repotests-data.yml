name: Repo tests data

# Producer of the pre-generated BOMs and slices the repo tests scan. The
# generate job runs third-party build code (cdxgen invokes the projects'
# package managers and compilers) and therefore holds no secret and no write
# token of any kind; only publish can write, and only to GHCR.
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  projects:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: names
        name: List the projects of projects.json
        run: echo "names=$(jq -c '[.projects[].name]' contrib/repotests/projects.json)" >> "$GITHUB_OUTPUT"

  generate:
    needs: projects
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.names) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install the pinned cdxgen
        run: npm install -g @cdxgen/cdxgen@13.8.0
      - name: Generate
        run: contrib/repotests/generate.sh '${{ matrix.project }}' src out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testdata-${{ matrix.project }}
          path: out
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [projects, generate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
      - name: Install depscan
        run: uv sync --all-extras --all-packages --dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: testdata-*
          path: out
          merge-multiple: true
      - name: Validate every generation
        run: |
          set -euo pipefail
          for NAME in $(jq -r '.projects[].name' contrib/repotests/projects.json); do
            echo "== $NAME"
            uv run --no-sync python contrib/repotests/validate.py staleness "out/$NAME" \
              --projects contrib/repotests/projects.json --name "$NAME"
            uv run --no-sync python contrib/repotests/validate.py assert "out/$NAME" \
              --projects contrib/repotests/projects.json --name "$NAME"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: validated-testdata
          path: out
          retention-days: 14

  # A dispatch from a feature branch stops after validate: its generate and
  # validate jobs exercise the same scripts the master run publishes with,
  # and the testdata-* artifacts on the run hold the files for inspection.
  # Publishing the same commits then needs one dispatch on master after the
  # merge, which is also when the lock file pull request is written.
  publish:
    needs: [projects, validate]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63  # v2.0.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: testdata-*
          path: out
          merge-multiple: true
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Push every generation and write the lock file
        run: contrib/repotests/publish.sh out ghcr.io/owasp-dep-scan/depscan-testdata
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testdata-lock
          path: out/testdata.lock.json
          if-no-files-found: error
          retention-days: 14
