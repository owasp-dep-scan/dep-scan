name: Python matrix CI

on:
  pull_request:
  # The merge queue needs the required build checks to run on the merge group.
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        uv sync --all-extras --all-packages --dev
    - name: Ruff
      run: |
        uv run ruff check .
    - name: Pyrefly
      run: |
        uv run pyrefly check
  build:
    env:
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-only:v7.0.x-xz"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash stops at the first failing command on every runner. The Windows
        # default, pwsh, only reports the exit code of the last command in a
        # step, which hid failures behind the command that followed them.
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # macOS runners are scarce, so macOS runs only the latest Python.
        exclude:
          - os: macos-26
            python-version: '3.11'
          - os: macos-26
            python-version: '3.12'
          - os: macos-26
            python-version: '3.13'
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '24.x'
        package-manager-cache: false
    - name: Set up JDK
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Trim CI agent
      # The script removes apt packages and Linux directories.
      if: ${{ runner.os == 'Linux' }}
      run: |
        chmod +x contrib/free_disk_space.sh
        ./contrib/free_disk_space.sh
    - name: Install dependencies
      run: |
        uv sync --all-extras --all-packages --dev
        npm install -g @cyclonedx/cdxgen
    - name: Test with pytest
      run: |
        # Run the top-level depscan tests, the analysis-lib tests (which
        # include the CSAF VEX generate-and-validate suite) and the server
        # tests.
        uv run pytest --cov=depscan test packages/analysis-lib/tests packages/server-lib/tests
        uv run depscan --config .config/depscan-dev.toml
      env:
        SCAN_DEBUG_MODE: debug
    - name: purl tests
      run: |
        uv run depscan --purl "pkg:pypi/requests@2.32.1"
        uv run depscan --purl "pkg:pypi/requests@4.0.0"
        uv run depscan --purl "pkg:pypi/reqwestss@0.1.0"
        uv run depscan --purl "pkg:npm/%40appthreat/cdxgen@7.0.5"
        uv run depscan --purl "pkg:npm/%40appthreat/cdxgen@7.1.0"
        uv run depscan --purl "pkg:npm/fsevents@1.2.10"
        uv run depscan --purl "pkg:npm/@biomejs/biome@1.8.1"
      env:
        PYTHONIOENCODING: utf-8
    - name: Custom data tests
      run: |
        mkdir -p custom_vulns
        cat > custom_vulns/private.yaml <<EOF
        dataType: CVE_RECORD
        dataVersion: "5.2"
        cveMetadata:
          cveId: PRIVATE-DEPSCAN-TEST
          assignerOrgId: 00000000-0000-4000-8000-000000000000
          state: PUBLISHED
          datePublished: "2024-01-01T00:00:00Z"
          dateUpdated: "2024-01-01T00:00:00Z"
        containers:
          cna:
            providerMetadata:
              orgId: 00000000-0000-4000-8000-000000000000
            descriptions:
              - lang: en
                value: "Depscan Test Vulnerability"
            affected:
              - vendor: internal
                product: custom-test
                packageName: custom-test
                packageURL: pkg:pypi/custom-test
                versions:
                  - version: "1.0.0"
                    status: affected
                    versionType: semver
        EOF

        uv run depscan --purl "pkg:pypi/custom-test@1.0.0" --custom-data custom_vulns
      if: ${{ matrix.os == 'ubuntu-latest' }}
      env:
        PYTHONIOENCODING: utf-8
