name: Agent plugin

# Validates the coding-agent plugin in agent-plugin/ with Claude Code's own
# validator, runs the structural checks that validator does not make, keeps
# the generated manifests from drifting, and runs the hook unit tests.
on:
  pull_request:
    paths:
      - '.github/workflows/agent-plugin.yml'
      - '.agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.gitattributes'
      - 'agent-plugin/**'
      - 'contrib/agent_manifests_template.json'
      - 'contrib/gen_agent_manifests.py'
      - 'contrib/check_agent_plugin.py'
      - 'contrib/schemas/**'
      - 'pyproject.toml'
      - 'test/test_agent_plugin_*.py'
  push:
    branches:
      - master
      - release/*
    paths:
      - '.github/workflows/agent-plugin.yml'
      - '.agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.gitattributes'
      - 'agent-plugin/**'
      - 'contrib/agent_manifests_template.json'
      - 'contrib/gen_agent_manifests.py'
      - 'contrib/check_agent_plugin.py'
      - 'contrib/schemas/**'
      - 'pyproject.toml'
      - 'test/test_agent_plugin_*.py'
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --dev --quiet
      - name: Keep the generated manifests from drifting
        run: uv run python -m contrib.gen_agent_manifests --check
      - name: Run the structural checks
        run: uv run python -m contrib.check_agent_plugin
      - name: Install Claude Code
        # Pinned to an exact release. The validator only reads files and needs
        # no API key.
        run: npm install --no-save --no-fund --prefix "$RUNNER_TEMP/claude" @anthropic-ai/claude-code@2.1.299
      - name: Validate the plugin and the marketplace
        run: |
          "$RUNNER_TEMP/claude/node_modules/.bin/claude" plugin validate --strict ./agent-plugin
          "$RUNNER_TEMP/claude/node_modules/.bin/claude" plugin validate --strict .
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      - name: Test the hooks
        run: uv run python -m pytest -q -p no:cacheprovider test/test_agent_plugin_hooks.py

  tool-commands:
    # Checks every sibling-tool command the skills publish against the
    # tools' own help: golem, rusi, kosi, dosai, trivy and trustinspector
    # from the plugins package, atom, cdx-audit, and the blint, atom-tools
    # and vdb versions dep-scan pins. Without these installs the test skips
    # each tool with a reason, so this job is where it actually runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '10.x'
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --dev --quiet
      - name: Install the sibling tools at pinned versions
        run: |
          npm install --no-save --no-fund --prefix "$RUNNER_TEMP/tools" \
            @cdxgen/cdxgen@13.8.0 \
            @cdxgen/cdxgen-plugins-bin-linux-amd64@4.3.1 \
            @appthreat/atom@4.0.2
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DEPSCAN_PLUGINS_DIR=$RUNNER_TEMP/tools/node_modules/@cdxgen/cdxgen-plugins-bin-linux-amd64/plugins" >> "$GITHUB_ENV"
      - name: Check the published sibling-tool commands
        run: uv run python -m pytest -q -p no:cacheprovider -o addopts="" -rs test/test_agent_plugin_tool_commands.py
