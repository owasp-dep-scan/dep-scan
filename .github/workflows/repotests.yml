          find "${GITHUB_WORKSPACE}/depscan_reports/vulnerable-aws-koa-app" -maxdepth 1 -type f \( -name '*.cdx.json' -o -name '*slices*.json' -o -name '*openapi*.json' -o -name '*.introspection.json' -o -name 'generation.json' \) -exec cp -p {} "${GITHUB_WORKSPACE}/repotests-gen/vulnerable-aws-koa-app/" \;
