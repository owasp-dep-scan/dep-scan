name: Repo tests

# merge_group lets the merge queue re-run required checks on the speculative
# merge commit; the repo-test matrix and the self-hosted semantics job skip
# those builds via their if:.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Pre-generated BOMs and slices are pulled from GHCR by the repotests-data
  # composite action, one artifact per project pinned by the manifest digests
  # of contrib/repotests/testdata.lock.json. Each matrix job pulls only what
  # its steps scan. The ukaina-boms job and its Hugging Face download are
  # gone: the dataset was generated by cdxgen 11.2.x with atom 2, which
  # dep-scan cannot read, and huggingface.co rate-limited the matrix.
  os-repo-tests:
    if: github.event_name != 'merge_group'
    env:
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
      PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'utf-8' || '' }}
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      DISABLE_CONSOLE_EMOJI: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # The unit tests in pythonapp.yml cover every supported Python. These
        # end-to-end scans exercise the operating systems, so each one runs on
        # the latest Python, and Ubuntu also runs the oldest supported one.
        # macOS is left out: hosted macOS arm64 runners are often unavailable
        # and the job is cancelled before it starts. pythonapp.yml still runs
        # the unit tests on macOS.
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm', 'windows-latest']
        python-version: ['3.14']
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: '1.23'
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409  # v1.5.15
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platform-tools'
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0  # v1.342.0
        with:
          ruby-version: '3.4.4'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Trim CI agent
        run: |
          chmod +x contrib/free_disk_space.sh
          ./contrib/free_disk_space.sh
        if: ${{ matrix.os != 'windows-latest' }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages --dev
          npm install -g @cdxgen/cdxgen@13.8.0
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: java-sec-code,dotnet-podcasts,vulnerable-aws-koa-app,signal-android,kafka-4.0.0,spring-petclinic,cdxgen,signal-desktop,forgejo,rustpad,django-defectdojo,depscan,phpmyadmin,openssl-3.5.0,open5gs-2.7.5,curl-8.13.0
          python-executable: uv run --no-sync python
      # Every pre-generated project below runs the same shape of step: copy
      # the pulled artifact into the reports layout, scan it with the
      # SemanticReachability analyzer and the --explain rendering the repo
      # tests exercise, then assert the reachable purl floor and the
      # mustReach packages of projects.json. A scan that silently finds
      # nothing fails the assert instead of passing on stale data.
      # java-sec-code and dotnet-podcasts also run the FrameworkReachability
      # analyzer, which only these two projects exercise.
      - name: repotests java-sec-code
        run: |
          .github/scripts/repotest-project.sh java-sec-code \
            -- --reachability-analyzer FrameworkReachability
        shell: bash
      - name: repotests dotnet-podcasts
        run: |
          .github/scripts/repotest-project.sh dotnet-podcasts \
            -- --reachability-analyzer FrameworkReachability
        shell: bash
      - name: repotests vulnerable-aws-koa-app
        run: |
          .github/scripts/repotest-project.sh vulnerable-aws-koa-app
        shell: bash
      - name: repotests signal-android
        run: |
          .github/scripts/repotest-project.sh signal-android
        shell: bash
      - name: repotests kafka-4.0.0
        run: |
          .github/scripts/repotest-project.sh kafka-4.0.0
        shell: bash
      - name: repotests spring-petclinic
        run: |
          .github/scripts/repotest-project.sh spring-petclinic
        shell: bash
      - name: repotests cdxgen
        run: |
          .github/scripts/repotest-project.sh cdxgen \
            -- --explanation-mode NonReachables
        shell: bash
      - name: repotests signal-desktop
        run: |
          .github/scripts/repotest-project.sh signal-desktop
        shell: bash
      - name: repotests forgejo
        run: |
          .github/scripts/repotest-project.sh forgejo
        shell: bash
      - name: repotests rustpad
        run: |
          .github/scripts/repotest-project.sh rustpad
        shell: bash
      - name: repotests django-defectdojo
        run: |
          .github/scripts/repotest-project.sh django-defectdojo \
            -- --explanation-mode Endpoints --explanation-mode NonReachables
        shell: bash
      - name: repotests depscan
        run: |
          .github/scripts/repotest-project.sh depscan \
            -- --explanation-mode Endpoints
        shell: bash
      - name: repotests phpmyadmin
        run: |
          .github/scripts/repotest-project.sh phpmyadmin
        shell: bash
      - name: repotests openssl-3.5.0
        run: |
          .github/scripts/repotest-project.sh openssl-3.5.0
        shell: bash
      - name: repotests open5gs-2.7.5
        run: |
          .github/scripts/repotest-project.sh open5gs-2.7.5
        shell: bash
      - name: repotests curl-8.13.0
        run: |
          .github/scripts/repotest-project.sh curl-8.13.0 \
            -- --explanation-mode NonReachables
        shell: bash
  os-semantics-tests:
    if: github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    runs-on: ['self-hosted', 'ubuntu', 'amd64']
    env:
      # The full database (several GB) repeatedly failed to download on the
      # self-hosted runner with IncompleteRead. This job checks that semantic
      # analysis runs end to end, not OS advisory counts, so it uses the
      # two-year app database, like the other test jobs, and the OS packages
      # from the source images are not matched.
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: depscan,dejacode
          python-executable: uv run --no-sync python
      # The semantics pipeline over data pinned by digest, where the
      # reachable purl floor can be asserted. Both projects are generated
      # by repotests-data.yml, so no step here runs cdxgen or atom.
      - name: semantic analysis over pinned data
        run: |
          .github/scripts/repotest-project.sh depscan
        shell: bash
      - name: semantic analysis dejacode
        run: |
          .github/scripts/repotest-project.sh dejacode \
            -- --explanation-mode NonReachables
        shell: bash
