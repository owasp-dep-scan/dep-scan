          cp -R "$GEN/." ${GITHUB_WORKSPACE}/repotests/dejacode/reports/
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dejacode/reports --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports --reachability-analyzer SemanticReachability --explain --explanation-mode NonReachables
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode2
          ls -lh ${GITHUB_WORKSPACE}/repotests/dejacode/reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: dejacode:latest
          CDXGEN_TIMEOUT_MS: 3600000
      - name: Save generated inputs (dejacode)
        continue-on-error: true
        if: steps.cache-dejacode.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/dejacode
          key: repotests-gen-dejacode-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-229e64908819ee697e7bbd813964443f4a72f990-${{ steps.cache-versions.outputs.command-line-files }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dejacode_reports
          path: depscan_reports/dejacode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dejacode_non_reachables
          path: depscan_reports/dejacode2
      - name: Log generated-input cache sizes
        if: always()
        run: |
          set -euo pipefail
          found=0
          for entry in "${GITHUB_WORKSPACE}"/repotests-gen/*; do
            if [ -d "$entry" ]; then
              found=1
