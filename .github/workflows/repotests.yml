name: Repo tests

# merge_group lets the merge queue re-run required checks on the speculative
# merge commit; the repo-test matrix and the self-hosted semantics job skip
# those builds via their if:.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Pre-generated BOMs and slices are pulled from GHCR by the repotests-data
  # composite action, one artifact per project pinned by the manifest digests
  # of contrib/repotests/testdata.lock.json. Each matrix job pulls only what
  # its steps scan. The ukaina-boms job and its Hugging Face download are
  # gone: the dataset was generated by cdxgen 11.2.x with atom 2, which
  # dep-scan cannot read, and huggingface.co rate-limited the matrix.
  os-repo-tests:
    if: github.event_name != 'merge_group'
    env:
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
      PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'utf-8' || '' }}
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      DISABLE_CONSOLE_EMOJI: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # The unit tests in pythonapp.yml cover every supported Python. These
        # end-to-end scans exercise the operating systems, so each one runs on
        # the latest Python, and Ubuntu also runs the oldest supported one.
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-26', 'windows-latest']
        python-version: ['3.14']
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'hoolicorp/java-sec-code'
          path: 'repotests/java-sec-code'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'HooliCorp/vulnerable-aws-koa-app'
          path: 'repotests/vulnerable-aws-koa-app'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'microsoft/dotnet-podcasts'
          path: 'repotests/dotnet-podcasts'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.23'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platform-tools'
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: '3.4.4'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '8.x'
      - name: Trim CI agent
        run: |
          chmod +x contrib/free_disk_space.sh
          ./contrib/free_disk_space.sh
        if: ${{ matrix.os != 'windows-latest' }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages --dev
          npm install -g @cdxgen/cdxgen@13.8.0
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: signal-android,kafka-4.0.0,spring-petclinic,cdxgen,signal-desktop,forgejo,rustpad,django-defectdojo,depscan,phpmyadmin,openssl-3.5.0,open5gs-2.7.5,curl-8.13.0
          python-executable: uv run --no-sync python
      - name: repotests java-sec-code
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code -t java --bom-engine CdxgenGenerator
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 --profile research -t java --bom-engine CdxgenGenerator --reachability-analyzer FrameworkReachability --explain
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2 --profile research -t java --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      # The BOMs, slices and VDRs of the java-sec-code runs, kept so the
      # reachable packages can be compared between releases.
      - name: Upload java-sec-code reports
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: java-sec-code-reports
          path: depscan_reports
      - name: Remove java-sec-code reports
        if: ${{ always() }}
        run: rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
      - name: repotests dotnet-podcasts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts1 ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts2
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/NetPodcast.Services.sln
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/NetPodcast.sln
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/Podcast.Web.sln
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts -t dotnet --bom-engine CdxgenGenerator
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts1 --profile research -t dotnet --bom-engine CdxgenGenerator --reachability-analyzer FrameworkReachability --explain
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts2 --profile research -t dotnet --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      - name: repotests vulnerable-aws-koa-app
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/vulnerable-aws-koa-app
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/vulnerable-aws-koa-app --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/vulnerable-aws-koa-app -t js --bom-engine CdxgenGenerator
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      # Every pre-generated project below runs the same shape of step: copy
      # the pulled artifact into the reports layout, scan it with the
      # SemanticReachability analyzer and the --explain rendering the repo
      # tests exercise, then assert the reachable purl floor and the
      # mustReach packages of projects.json. A scan that silently finds
      # nothing fails the assert instead of passing on stale data.
      - name: repotests signal-android
        run: |
          .github/scripts/repotest-project.sh signal-android
        shell: bash
      - name: repotests kafka-4.0.0
        run: |
          .github/scripts/repotest-project.sh kafka-4.0.0
        shell: bash
      - name: repotests spring-petclinic
        run: |
          .github/scripts/repotest-project.sh spring-petclinic
        shell: bash
      - name: repotests cdxgen
        run: |
          .github/scripts/repotest-project.sh cdxgen \
            -- --explanation-mode NonReachables
        shell: bash
      - name: repotests signal-desktop
        run: |
          .github/scripts/repotest-project.sh signal-desktop
        shell: bash
      - name: repotests forgejo
        run: |
          .github/scripts/repotest-project.sh forgejo
        shell: bash
      - name: repotests rustpad
        run: |
          .github/scripts/repotest-project.sh rustpad
        shell: bash
      - name: repotests django-defectdojo
        run: |
          .github/scripts/repotest-project.sh django-defectdojo \
            -- --explanation-mode Endpoints --explanation-mode NonReachables
        shell: bash
      - name: repotests depscan
        run: |
          .github/scripts/repotest-project.sh depscan \
            -- --explanation-mode Endpoints
        shell: bash
      - name: repotests phpmyadmin
        run: |
          .github/scripts/repotest-project.sh phpmyadmin
        shell: bash
      - name: repotests openssl-3.5.0
        run: |
          .github/scripts/repotest-project.sh openssl-3.5.0
        shell: bash
      - name: repotests open5gs-2.7.5
        run: |
          .github/scripts/repotest-project.sh open5gs-2.7.5
        shell: bash
      - name: repotests curl-8.13.0
        run: |
          .github/scripts/repotest-project.sh curl-8.13.0 \
            -- --explanation-mode NonReachables
        shell: bash
  os-semantics-tests:
    if: github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    runs-on: ['self-hosted', 'ubuntu', 'amd64']
    env:
      # The full database (several GB) repeatedly failed to download on the
      # self-hosted runner with IncompleteRead. This job checks that semantic
      # analysis runs end to end, not OS advisory counts, so it uses the
      # two-year app database, like the other test jobs, and the OS packages
      # from the source images are not matched.
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages
          # This job runs on a self-hosted runner that keeps global npm
          # packages between runs. The cdxgen 12 package name installs the
          # same commands (cdxgen, cbom, ...), so npm refuses to install 13.8
          # over it with EEXIST until it is removed.
          sudo npm uninstall -g @cyclonedx/cdxgen
          sudo npm install -g @cdxgen/cdxgen@13.8.0 @appthreat/atom --omit=optional
      - name: semantic analysis self
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/depscan
          uv run vdb --clean
          uv run depscan --src ${GITHUB_WORKSPACE} --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/depscan -t python --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          ls -lh ${GITHUB_WORKSPACE}/depscan_reports/depscan
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: ghcr.io/owasp-dep-scan/dep-scan:master
          CDXGEN_TIMEOUT_MS: 3600000
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: depscan
          python-executable: uv run --no-sync python
      # The same semantics pipeline over data pinned by digest, where the
      # reachable purl floor can be asserted; the self scan above exercises
      # the current checkout, whose reachable set moves with every commit.
      - name: semantic analysis over pinned data
        run: |
          .github/scripts/repotest-project.sh depscan
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'aboutcode-org/dejacode'
          path: 'repotests/dejacode'
          persist-credentials: false
      - name: semantic analysis dejacode
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports ${GITHUB_WORKSPACE}/repotests/dejacode/reports
          cd ${GITHUB_WORKSPACE}/repotests/dejacode
          docker build -t dejacode:latest -f Dockerfile .
          uv pip install --find-links=thirdparty/dist/ --no-index --no-cache-dir .
          cd ${GITHUB_WORKSPACE}
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/dejacode --reports-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports -t python --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode
          uv run depscan --src ${GITHUB_WORKSPACE}/repotests/dejacode --bom-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports --reports-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports --reachability-analyzer SemanticReachability --explain --explanation-mode NonReachables
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode2
          ls -lh ${GITHUB_WORKSPACE}/repotests/dejacode/reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: dejacode:latest
          CDXGEN_TIMEOUT_MS: 3600000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dejacode_reports
          path: depscan_reports/dejacode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dejacode_non_reachables
          path: depscan_reports/dejacode2
