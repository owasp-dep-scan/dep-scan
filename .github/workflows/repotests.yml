        shell: bash
  os-semantics-tests:
    if: github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    runs-on: ['self-hosted', 'ubuntu', 'amd64']
    env:
      # The full database (several GB) repeatedly failed to download on the
      # self-hosted runner with IncompleteRead. This job checks that semantic
      # analysis runs end to end, not OS advisory counts, so it uses the
      # two-year app database, like the other test jobs, and the OS packages
      # from the source images are not matched.
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages
          # This job runs on a self-hosted runner that keeps global npm
          # packages between runs. The cdxgen 12 package name installs the
          # same commands (cdxgen, cbom, ...), so npm refuses to install 13.8
          # over it with EEXIST until it is removed.
          sudo npm uninstall -g @cyclonedx/cdxgen
          sudo npm install -g @cdxgen/cdxgen@13.8.0 @appthreat/atom --omit=optional
      - name: Resolve generated-input cache versions
        id: cache-versions
        env:
          COMMAND_LINE_FILES_HASH: ${{ hashFiles('packages/xbom-lib/src/xbom_lib/cdxgen.py', 'packages/xbom-lib/src/xbom_lib/process.py', 'depscan/lib/bom.py', 'depscan/lib/pipeline.py', 'depscan/lib/config.py', 'depscan/cli_options.py', 'depscan/commands/scan.py') }}
          SELF_PROJECT_FILES_HASH: ${{ hashFiles('uv.lock', '**/pyproject.toml') }}
        run: |
          set -euo pipefail
          # cdxgen --version prints a colored banner "CycloneDX Generator
          # <version>" followed by the Node runtime line, so the first
          # version-like token of the output is the cdxgen version.
          CDXGEN_VERSION="$(cdxgen --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$CDXGEN_VERSION" ]; then
            echo "Could not resolve the cdxgen version from the cdxgen --version output." >&2
            exit 1
          fi
          # cdxgen runs the atom copy nested in its own node_modules when one
          # is there (this job's explicit install can diverge from cdxgen's
          # own dependency and nests under it) and the hoisted global copy
          # otherwise, so the candidates are checked in that order. The
          # lookup runs inside node because npm root -g prints a
          # Windows-style path that a bash-side reader would mangle.
          ATOM_VERSION="$(node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const path = require("path");
            let root;
            try {
              root = execSync("npm root -g", { encoding: "utf8" }).trim();
            } catch (e) {
              console.error("Could not resolve the global npm root: " + e.message);
              process.exit(1);
            }
            const candidates = [
              path.join(root, "@cdxgen", "cdxgen", "node_modules", "@appthreat", "atom"),
              path.join(root, "@appthreat", "atom"),
            ];
            for (const candidate of candidates) {
              try {
                const version = JSON.parse(fs.readFileSync(path.join(candidate, "package.json"), "utf8")).version;
                if (version) {
                  console.log(version);
                  process.exit(0);
                }
              } catch (e) {
                // No atom at this location; try the next one.
              }
            }
            console.error("No @appthreat/atom install found under " + root + "; the atom version is required for the cache keys.");
            process.exit(1);
          ')"
          echo "cdxgen-version=$CDXGEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "atom-version=$ATOM_VERSION" >> "$GITHUB_OUTPUT"
          echo "command-line-files=$COMMAND_LINE_FILES_HASH" >> "$GITHUB_OUTPUT"
          echo "self-project-files=$SELF_PROJECT_FILES_HASH" >> "$GITHUB_OUTPUT"
          echo "Resolved cdxgen $CDXGEN_VERSION, atom $ATOM_VERSION, command line file hash ${COMMAND_LINE_FILES_HASH:-missing}, self project file hash ${SELF_PROJECT_FILES_HASH:-missing}"
      # The self entry keys on the dependency manifests, not every Python
      # file, so an ordinary code change reuses the slices of this checkout.
      - name: Restore generated inputs (self)
        id: cache-self
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/self
          key: repotests-gen-self-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-${{ steps.cache-versions.outputs.self-project-files }}-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (dejacode)
        id: cache-dejacode
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/dejacode
          key: repotests-gen-dejacode-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-229e64908819ee697e7bbd813964443f4a72f990-${{ steps.cache-versions.outputs.command-line-files }}
      - name: semantic analysis self
        if: steps.cache-self.outputs.cache-matched-key == ''
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/depscan
          uv run vdb --clean
          uv run depscan scan ${GITHUB_WORKSPACE} --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/depscan -t python --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          # Keep only what cdxgen and atom wrote, so the saved entry can be
          # re-scanned as a BOM directory on a cache hit.
          mkdir -p "${GITHUB_WORKSPACE}/repotests-gen/self"
          find "${GITHUB_WORKSPACE}/depscan_reports/depscan" -maxdepth 1 -type f \( -name '*.cdx.json' -o -name '*slices*.json' -o -name '*openapi*.json' -o -name '*.introspection.json' -o -name 'generation.json' \) -exec cp -p {} "${GITHUB_WORKSPACE}/repotests-gen/self/" \;
          ls -lh ${GITHUB_WORKSPACE}/depscan_reports/depscan
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: ghcr.io/owasp-dep-scan/dep-scan:master
          CDXGEN_TIMEOUT_MS: 3600000
      - name: semantic analysis self (cached bom-dir)
        if: steps.cache-self.outputs.cache-matched-key != ''
        run: |
          GEN="${GITHUB_WORKSPACE}/repotests-gen/self"
