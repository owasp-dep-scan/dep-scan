            if [ -z "$(ls "$GEN"/$pattern 2>/dev/null)" ]; then
              echo "The restored inputs in $GEN carry no file matching $pattern. Dispatch this workflow on the default branch with regenerate to rebuild them." >&2
              exit 1
            fi
          done
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/depscan
          uv run vdb --clean
          uv run depscan scan "$GEN" --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/depscan --reachability-analyzer SemanticReachability --explain
          ls -lh ${GITHUB_WORKSPACE}/depscan_reports/depscan
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: ghcr.io/owasp-dep-scan/dep-scan:master
          CDXGEN_TIMEOUT_MS: 3600000
      - name: Save generated inputs (self)
        continue-on-error: true
        if: steps.cache-self.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/self
          key: repotests-gen-self-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-${{ steps.cache-versions.outputs.self-project-files }}-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: depscan
          python-executable: uv run --no-sync python
      # The same semantics pipeline over data pinned by digest, where the
      # reachable purl floor can be asserted; the self scan above exercises
      # the current checkout, whose reachable set moves with every commit.
      - name: semantic analysis over pinned data
        run: |
          .github/scripts/repotest-project.sh depscan
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'aboutcode-org/dejacode'
          ref: '229e64908819ee697e7bbd813964443f4a72f990'  # main
          path: 'repotests/dejacode'
          persist-credentials: false
      # The docker build and the uv pip install produce only what cdxgen
      # reads (the installed package and the container image), so they stay
      # on the miss path only.
      - name: semantic analysis dejacode
        if: steps.cache-dejacode.outputs.cache-matched-key == ''
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports ${GITHUB_WORKSPACE}/repotests/dejacode/reports
          cd ${GITHUB_WORKSPACE}/repotests/dejacode
          docker build -t dejacode:latest -f Dockerfile .
          uv pip install --find-links=thirdparty/dist/ --no-index --no-cache-dir .
          cd ${GITHUB_WORKSPACE}
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dejacode --reports-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports -t python --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode
          # Keep only what cdxgen and atom wrote, so the saved entry can be
          # re-scanned as a BOM directory on a cache hit.
          mkdir -p "${GITHUB_WORKSPACE}/repotests-gen/dejacode"
          find "${GITHUB_WORKSPACE}/repotests/dejacode/reports" -maxdepth 1 -type f \( -name '*.cdx.json' -o -name '*slices*.json' -o -name '*openapi*.json' -o -name '*.introspection.json' -o -name 'generation.json' \) -exec cp -p {} "${GITHUB_WORKSPACE}/repotests-gen/dejacode/" \;
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dejacode/reports --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/repotests/dejacode/reports --reachability-analyzer SemanticReachability --explain --explanation-mode NonReachables
          cp -rf ${GITHUB_WORKSPACE}/repotests/dejacode/reports ${GITHUB_WORKSPACE}/depscan_reports/dejacode2
          ls -lh ${GITHUB_WORKSPACE}/repotests/dejacode/reports
        shell: bash
        env:
          DEPSCAN_SOURCE_IMAGE: dejacode:latest
          CDXGEN_TIMEOUT_MS: 3600000
      - name: semantic analysis dejacode (cached bom-dir)
        if: steps.cache-dejacode.outputs.cache-matched-key != ''
        run: |
          GEN="${GITHUB_WORKSPACE}/repotests-gen/dejacode"
          for pattern in '*.cdx.json' '*slices*.json'; do
            if [ -z "$(ls "$GEN"/$pattern 2>/dev/null)" ]; then
