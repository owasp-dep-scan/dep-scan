name: Repo tests

# merge_group lets the merge queue re-run required checks on the speculative
# merge commit; the repo-test matrix and the self-hosted semantics job skip
# those builds via their if:.
#
# The weekly schedule and the workflow_dispatch regenerate input both skip
# the generated-input cache restores, so the cdxgen and atom generation path
# itself keeps being exercised. The scheduled or dispatched run on the
# default branch is what seeds the cache entries pull requests restore: a
# pull request can only restore caches its own branch or the default branch
# saved, and this workflow deliberately has no push trigger.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Skip the generated-input restores and rerun the full cdxgen and atom generation'
        type: boolean
        required: false
        default: false
  schedule:
    # Mondays 05:00 UTC, on the default branch.
    - cron: '0 5 * * 1'

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Pre-generated BOMs and slices are pulled from GHCR by the repotests-data
  # composite action, one artifact per project pinned by the manifest digests
  # of contrib/repotests/testdata.lock.json. Each matrix job pulls only what
  # its steps scan. The ukaina-boms job and its Hugging Face download are
  # gone: the dataset was generated by cdxgen 11.2.x with atom 2, which
  # dep-scan cannot read, and huggingface.co rate-limited the matrix.
  #
  # The projects that used to generate their own BOMs and slices on every run
  # (java-sec-code, dotnet-podcasts, vulnerable-aws-koa-app) now restore them
  # from the generated-input caches keyed below. A restore hit re-scans the
  # restored directory as a BOM directory target, so every run still tests
  # dep-scan's analysis; a miss runs the full generation and saves an entry.
  os-repo-tests:
    if: github.event_name != 'merge_group'
    env:
      VDB_DATABASE_URL: "ghcr.io/appthreat/vdb7-app-2y:v7.0.x-xz"
      PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'utf-8' || '' }}
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      DISABLE_CONSOLE_EMOJI: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # The unit tests in pythonapp.yml cover every supported Python. These
        # end-to-end scans exercise the operating systems, so each one runs on
        # the latest Python, and Ubuntu also runs the oldest supported one.
        # macOS is left out: hosted macOS arm64 runners are often unavailable
        # and the job is cancelled before it starts. pythonapp.yml still runs
        # the unit tests on macOS.
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm', 'windows-latest']
        python-version: ['3.14']
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'hoolicorp/java-sec-code'
          # Pinned so the cache key is stable; the pin tracks the master HEAD.
          ref: '7f7f02a9e030736dd4ef4fa657511b26c4c5c016'
          path: 'repotests/java-sec-code'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'HooliCorp/vulnerable-aws-koa-app'
          ref: 'dde4187bf21f0d56b6867fffd09f93ff0e275a80'  # main
          path: 'repotests/vulnerable-aws-koa-app'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'microsoft/dotnet-podcasts'
          ref: '5ee8be2990b81eb681bbd100875c263aaa5ab68a'  # main
          path: 'repotests/dotnet-podcasts'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.23'
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platform-tools'
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: '3.4.4'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '8.x'
      - name: Trim CI agent
        run: |
          chmod +x contrib/free_disk_space.sh
          ./contrib/free_disk_space.sh
        if: ${{ matrix.os != 'windows-latest' }}
      - name: Install depscan
        run: |
          uv sync --all-extras --all-packages --dev
          npm install -g @cdxgen/cdxgen@13.8.0
      - name: Resolve generated-input cache versions
        id: cache-versions
        env:
          COMMAND_LINE_FILES_HASH: ${{ hashFiles('packages/xbom-lib/src/xbom_lib/cdxgen.py', 'packages/xbom-lib/src/xbom_lib/process.py', 'depscan/lib/bom.py', 'depscan/lib/pipeline.py', 'depscan/lib/config.py', 'depscan/cli_options.py', 'depscan/commands/scan.py') }}
        run: |
          set -euo pipefail
          # cdxgen --version prints a colored banner "CycloneDX Generator
          # <version>" followed by the Node runtime line, so the first
          # version-like token of the output is the cdxgen version.
          CDXGEN_VERSION="$(cdxgen --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$CDXGEN_VERSION" ]; then
            echo "Could not resolve the cdxgen version from the cdxgen --version output." >&2
            exit 1
          fi
          # cdxgen runs the atom copy nested in its own node_modules when one
          # is there (a diverging explicit install nests under it) and the
          # hoisted global copy otherwise, so the candidates are checked in
          # that order. The lookup runs inside node because npm root -g
          # prints a Windows-style path that a bash-side reader would mangle.
          ATOM_VERSION="$(node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const path = require("path");
            let root;
            try {
              root = execSync("npm root -g", { encoding: "utf8" }).trim();
            } catch (e) {
              console.error("Could not resolve the global npm root: " + e.message);
              process.exit(1);
            }
            const candidates = [
              path.join(root, "@cdxgen", "cdxgen", "node_modules", "@appthreat", "atom"),
              path.join(root, "@appthreat", "atom"),
            ];
            for (const candidate of candidates) {
              try {
                const version = JSON.parse(fs.readFileSync(path.join(candidate, "package.json"), "utf8")).version;
                if (version) {
                  console.log(version);
                  process.exit(0);
                }
              } catch (e) {
                // No atom at this location; try the next one.
              }
            }
            console.error("No @appthreat/atom install found under " + root + "; the atom version is required for the cache keys.");
            process.exit(1);
          ')"
          echo "cdxgen-version=$CDXGEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "atom-version=$ATOM_VERSION" >> "$GITHUB_OUTPUT"
          echo "command-line-files=$COMMAND_LINE_FILES_HASH" >> "$GITHUB_OUTPUT"
          echo "Resolved cdxgen $CDXGEN_VERSION, atom $ATOM_VERSION, command line file hash ${COMMAND_LINE_FILES_HASH:-missing}"
      # The generated-input caches below hold what cdxgen and atom wrote into
      # the reports directories of a full run: the *.cdx.json BOMs, the
      # *slices*.json atom slices, the *openapi*.json spec files atom writes
      # under the research profile, cdxgen's *.introspection.json reports and
      # a generation.json provenance record when one exists. dep-scan's own
      # outputs (VDR, risk and license reports, findings and manifest, the
      # analysis fallback reports) are never cached: every run re-derives
      # them, which is what these scans exist to test. The keys name the
      # project commit, the runner OS and architecture, the cdxgen and atom
      # versions, and the hash of the dep-scan files that build the cdxgen
      # command line and its environment, resolved in the step above.
      - name: Restore generated inputs (java-sec-code)
        id: cache-java-sec-code
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code
          key: repotests-gen-java-sec-code-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (java-sec-code1)
        id: cache-java-sec-code1
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code1
          key: repotests-gen-java-sec-code1-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (java-sec-code2)
        id: cache-java-sec-code2
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code2
          key: repotests-gen-java-sec-code2-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (dotnet-podcasts)
        id: cache-dotnet-podcasts
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/dotnet-podcasts
          key: repotests-gen-dotnet-podcasts-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-5ee8be2990b81eb681bbd100875c263aaa5ab68a-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (dotnet-podcasts1)
        id: cache-dotnet-podcasts1
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/dotnet-podcasts1
          key: repotests-gen-dotnet-podcasts1-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-5ee8be2990b81eb681bbd100875c263aaa5ab68a-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (dotnet-podcasts2)
        id: cache-dotnet-podcasts2
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/dotnet-podcasts2
          key: repotests-gen-dotnet-podcasts2-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-5ee8be2990b81eb681bbd100875c263aaa5ab68a-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Restore generated inputs (vulnerable-aws-koa-app)
        id: cache-vulnerable-aws-koa-app
        if: github.event_name != 'schedule' && inputs.regenerate != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/vulnerable-aws-koa-app
          key: repotests-gen-vulnerable-aws-koa-app-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-dde4187bf21f0d56b6867fffd09f93ff0e275a80-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Get repo test data
        uses: ./.github/actions/repotests-data
        with:
          projects: signal-android,kafka-4.0.0,spring-petclinic,cdxgen,signal-desktop,forgejo,rustpad,django-defectdojo,depscan,phpmyadmin,openssl-3.5.0,open5gs-2.7.5,curl-8.13.0
          python-executable: uv run --no-sync python
      # The plain-profile scan of the three variants. It runs whenever any of
      # the three variants missed its cache; a partial hit simply regenerates
      # every variant, which is today's behaviour. The dotnet builds below
      # produce only what cdxgen reads (build output for the BOM), so they
      # stay on this miss path only.
      - name: repotests java-sec-code
        if: steps.cache-java-sec-code.outputs.cache-matched-key == '' || steps.cache-java-sec-code1.outputs.cache-matched-key == '' || steps.cache-java-sec-code2.outputs.cache-matched-key == ''
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code -t java --bom-engine CdxgenGenerator
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 --bom-profile research -t java --bom-engine CdxgenGenerator --reachability-analyzer FrameworkReachability --explain
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/java-sec-code --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2 --bom-profile research -t java --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          # Keep only what cdxgen and atom wrote, so the saved entry can be
          # re-scanned as a BOM directory on a cache hit.
          for variant in java-sec-code java-sec-code1 java-sec-code2; do
            mkdir -p "${GITHUB_WORKSPACE}/repotests-gen/$variant"
            find "${GITHUB_WORKSPACE}/depscan_reports/$variant" -maxdepth 1 -type f \( -name '*.cdx.json' -o -name '*slices*.json' -o -name '*openapi*.json' -o -name '*.introspection.json' -o -name 'generation.json' \) -exec cp -p {} "${GITHUB_WORKSPACE}/repotests-gen/$variant/" \;
          done
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      # Every variant's entry restored: re-scan the restored directories as
      # BOM directories with the same reachability and explain options, which
      # is the part of the pipeline these scans exist to test.
      - name: repotests java-sec-code (cached bom-dir)
        if: steps.cache-java-sec-code.outputs.cache-matched-key != '' && steps.cache-java-sec-code1.outputs.cache-matched-key != '' && steps.cache-java-sec-code2.outputs.cache-matched-key != ''
        run: |
          GEN="${GITHUB_WORKSPACE}/repotests-gen"
          require_inputs() {
            dir="$1"; shift
            for pattern in "$@"; do
              if [ -z "$(ls "$dir"/$pattern 2>/dev/null)" ]; then
                echo "The restored inputs in $dir carry no file matching $pattern. Dispatch this workflow on the default branch with regenerate to rebuild them." >&2
                exit 1
              fi
            done
          }
          require_inputs "$GEN/java-sec-code" '*.cdx.json'
          require_inputs "$GEN/java-sec-code1" '*.cdx.json' '*slices*.json'
          require_inputs "$GEN/java-sec-code2" '*.cdx.json' '*slices*.json'
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2
          uv run depscan scan "$GEN/java-sec-code" --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code
          uv run depscan scan "$GEN/java-sec-code1" --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code1 --reachability-analyzer FrameworkReachability --explain
          uv run depscan scan "$GEN/java-sec-code2" --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/java-sec-code2 --reachability-analyzer SemanticReachability --explain
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      # The BOMs, slices and VDRs of the java-sec-code runs, kept so the
      # reachable packages can be compared between releases.
      - name: Upload java-sec-code reports
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: java-sec-code-reports
          path: depscan_reports
      - name: Remove java-sec-code reports
        if: ${{ always() }}
        run: rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
      - name: Save generated inputs (java-sec-code)
        # A concurrent run can reserve the same fresh key first; the losing
        # save stays visible as a failed step and costs nothing.
        continue-on-error: true
        if: steps.cache-java-sec-code.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code
          key: repotests-gen-java-sec-code-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Save generated inputs (java-sec-code1)
        continue-on-error: true
        if: steps.cache-java-sec-code1.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code1
          key: repotests-gen-java-sec-code1-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      - name: Save generated inputs (java-sec-code2)
        continue-on-error: true
        if: steps.cache-java-sec-code2.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: repotests-gen/java-sec-code2
          key: repotests-gen-java-sec-code2-${{ runner.os }}-${{ runner.arch }}-cdxgen${{ steps.cache-versions.outputs.cdxgen-version }}-atom${{ steps.cache-versions.outputs.atom-version }}-7f7f02a9e030736dd4ef4fa657511b26c4c5c016-${{ steps.cache-versions.outputs.command-line-files }}
      # The dotnet builds produce only what cdxgen reads for the BOM; the
      # scans themselves never read the build output, so they stay on the
      # miss path only.
      - name: repotests dotnet-podcasts
        if: steps.cache-dotnet-podcasts.outputs.cache-matched-key == '' || steps.cache-dotnet-podcasts1.outputs.cache-matched-key == '' || steps.cache-dotnet-podcasts2.outputs.cache-matched-key == ''
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts1 ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts2
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/NetPodcast.Services.sln
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/NetPodcast.sln
          dotnet build ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts/Podcast.Web.sln
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts -t dotnet --bom-engine CdxgenGenerator
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts1 --bom-profile research -t dotnet --bom-engine CdxgenGenerator --reachability-analyzer FrameworkReachability --explain
          uv run depscan scan ${GITHUB_WORKSPACE}/repotests/dotnet-podcasts --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts2 --bom-profile research -t dotnet --bom-engine CdxgenGenerator --reachability-analyzer SemanticReachability --explain
          for variant in dotnet-podcasts dotnet-podcasts1 dotnet-podcasts2; do
            mkdir -p "${GITHUB_WORKSPACE}/repotests-gen/$variant"
            find "${GITHUB_WORKSPACE}/depscan_reports/$variant" -maxdepth 1 -type f \( -name '*.cdx.json' -o -name '*slices*.json' -o -name '*openapi*.json' -o -name '*.introspection.json' -o -name 'generation.json' \) -exec cp -p {} "${GITHUB_WORKSPACE}/repotests-gen/$variant/" \;
          done
          rm -rf ${GITHUB_WORKSPACE}/depscan_reports
        shell: bash
        env:
          BLINTDB_HOME: ${{ runner.temp }}/blintdb-home
      - name: repotests dotnet-podcasts (cached bom-dir)
        if: steps.cache-dotnet-podcasts.outputs.cache-matched-key != '' && steps.cache-dotnet-podcasts1.outputs.cache-matched-key != '' && steps.cache-dotnet-podcasts2.outputs.cache-matched-key != ''
        run: |
          GEN="${GITHUB_WORKSPACE}/repotests-gen"
          require_inputs() {
            dir="$1"; shift
            for pattern in "$@"; do
              if [ -z "$(ls "$dir"/$pattern 2>/dev/null)" ]; then
                echo "The restored inputs in $dir carry no file matching $pattern. Dispatch this workflow on the default branch with regenerate to rebuild them." >&2
                exit 1
              fi
            done
          }
          require_inputs "$GEN/dotnet-podcasts" '*.cdx.json'
          require_inputs "$GEN/dotnet-podcasts1" '*.cdx.json' '*slices*.json'
          require_inputs "$GEN/dotnet-podcasts2" '*.cdx.json' '*slices*.json'
          mkdir -p ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts1 ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts2
          uv run depscan scan "$GEN/dotnet-podcasts" --target-kind bom-dir --reports-dir ${GITHUB_WORKSPACE}/depscan_reports/dotnet-podcasts
